# Nothing here is decoration. A 512m heap is where a single-module, three-file build lives;
# the daemon default is larger and just makes the runner wait.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m
org.gradle.parallel=false
org.gradle.caching=true

# Java-only app, no AndroidX at all — see app/build.gradle. Stated so that a future
# dependency on an androidx artifact is a decision someone has to notice rather than a build
# that mysteriously stops compiling.
android.useAndroidX=false
android.nonTransitiveRClass=true
