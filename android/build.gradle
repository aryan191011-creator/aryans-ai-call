plugins {
    // 8.1.4 rather than the newest: 8.1 is the line that runs on the ubuntu-24.04 image with
    // JDK 17 and an Android SDK 34 install, which is what Actions hands out. Chasing the
    // latest AGP buys an upgrade to the Gradle and SDK requirements as well, for an app whose
    // entire build is "copy three files into a zip and sign it".
    id 'com.android.application' version '8.1.4'
}
