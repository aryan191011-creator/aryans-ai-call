# Committed without the jar on purpose: the jar is a 43KB binary whose only job is to download
# the distribution that CI installs anyway, and a wrapper JAR in a repo is a supply-chain
# surface nobody reviews. Run `gradle wrapper` once if you want ./gradlew locally; the
# workflow calls `gradle` directly and needs nothing from this file.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
