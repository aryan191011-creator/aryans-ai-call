name: pages

# Publish web/ to GitHub Pages. Free, HTTPS forever, and it never sleeps —
# unlike this sandbox, which pauses between turns and takes the dev server with
# it. The app needs no backend: the browser talks to Gemini directly.
#
# Prerequisite (one-time, in the repo's Settings → Pages):
#   Source: GitHub Actions
# Without that toggle this run fails with "Pages not enabled".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # web/ is the site root, so /app.js and /styles.css resolve as the app expects.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.out.outputs.page_url }}
    steps:
      - id: out
        uses: actions/deploy-pages@v4
