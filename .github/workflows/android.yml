name: android

# The APK is built here and not in the sandbox, for a boring reason: there is no JDK, no Gradle
# and no Android SDK in the dev container, and dl.google.com is unreachable from it, so there is
# no honest way to produce a signed artifact from here. Everything about this build is ordinary.
#
# It also means the artifact is reproducible from the repo alone: same inputs, same three staged
# files, same checked-in debug key. No signing secret to configure, nothing to lose.
#
# Triggers: a tag publishes a Release with the APK on it; a push to main or a manual run builds
# the APK as a downloadable artifact for 30 days.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'android/**'
      - 'web/**'
      - 'scripts/check-apk.mjs'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle is preinstalled on the runner image, and the wrapper jar is deliberately not in
      # the repo (a 43KB binary that downloads a distribution, in a tree nobody audits). So:
      # invoke `gradle` directly. If you want ./gradlew locally, run `gradle wrapper` once.
      - name: Localise the toolchain
        run: |
          java -version
          gradle --version | sed -n '1,8p'

      - name: Static APK checks (no compiler here can catch these)
        run: node scripts/check-apk.mjs

      - name: Verify the signing key is readable and self-consistent
        # Cheap, and it fails at second 5 instead of minute 6. Also prints the SHA-256 of the
        # certificate: paste that into a comparison when a phone refuses to update the app,
        # because "different signature" and "Android 14 blocks unknown installers" look the same
        # from the user's side and are not the same problem.
        run: |
          keytool -list -v -keystore android/debug.keystore -storepass android \
            -storetype PKCS12 | grep -E 'Alias|Valid|SHA256|Signature algorithm'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Build
        working-directory: android
        env:
          # Only two things are needed to make a release build reproducible: no daemon left
          # holding state, and no surprise from a Gradle property someone set in their shell.
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug

      - name: What is actually in the APK
        # Unbundles the release artifact and checks the staged page survived aapt's path
        # rewriting. The failure this catches is silent: an empty assets dir yields a valid,
        # signed, installable APK that shows a 404.
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$apk" | grep -E 'assets/web/(index\.html|app\.js|styles\.css)'
          unzip -l "$apk" | grep -E 'mipmap-(mdpi|xxxhdpi)/ic_launcher(_round)?\.png' | head -4
          unzip -p "$apk" AndroidManifest.xml >/dev/null
          "$ANDROID_HOME"/build-tools/34.0.0/aapt2 dump badging "$apk" \
            | grep -E "package:|uses-permission:|application-label|sdkVersion"
          du -h "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: aryans-ai-call-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish a Release with the APK attached
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          body: |
            Sideloadable release build, signed with the repo's checked-in debug key.

            * Install it directly; it needs no Play Store and no account.
            * Update by installing again over the top — the same key is used, so your saved key
              and settings survive. This is the part a runner-generated key would have broken.
            * Android will ask you to allow "install unknown apps" for whichever app opens the
              link. That prompt is the whole cost of not being in the store.
            * Your Gemini API key is typed into the app on first launch and never leaves the
              phone except to `generativelanguage.googleapis.com`.
