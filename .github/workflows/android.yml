name: android

# The APK is built here and not in the sandbox, for a boring reason: there is no JDK, no Gradle
# and no Android SDK in the dev container, and dl.google.com is unreachable from it, so there is
# no honest way to produce a signed artifact from here. Everything about this build is ordinary.
#
# It also means the artifact is reproducible from the repo alone: same inputs, same three staged
# files, same checked-in debug key. No signing secret to configure, nothing to lose.
#
# Triggers: a tag publishes a Release with the APK on it; a push to main or a manual run builds
# the APK as a downloadable artifact for 30 days.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'android/**'
      - 'web/**'
      - 'scripts/check-apk.mjs'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle is pinned rather than inherited. The runner image ships one, and which version
      # that is changes without this repo doing anything — an image bump to a Gradle that AGP
      # 8.1 cannot configure is a build that fails in 40 seconds with a message about
      # `Convention`, and it looks like our fault. Also: no wrapper jar is committed, so
      # there is nothing here for the image to disagree with.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          # AGP 8.1's own floor is 8.0; 8.5 is the line it is regularly tested against.

      - name: Localise the toolchain
        run: |
          java -version
          gradle --version | sed -n '1,8p'
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Static APK checks (no compiler here can catch these)
        # tee, because the reporting step below needs the text of whichever verification failed.
        run: |
          set -o pipefail
          node scripts/check-apk.mjs 2>&1 | tee /tmp/ci.log

      - name: Verify the signing key is readable and self-consistent
        # Cheap, and it fails at second 5 instead of minute 6. Also prints the SHA-256 of the
        # certificate: paste that into a comparison when a phone refuses to update the app,
        # because "different signature" and "Android 14 blocks unknown installers" look the same
        # from the user's side and are not the same problem.
        run: |
          keytool -list -v -keystore android/debug.keystore -storepass android \
            -storetype PKCS12 | grep -E 'Alias|Valid|SHA256|Signature algorithm'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Build
        working-directory: android
        env:
          # Only two things are needed to make a release build reproducible: no daemon left
          # holding state, and no surprise from a Gradle property someone set in their shell.
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        # pipefail matters: without it, `gradle … | tee` reports the exit status of tee, and a
        # red X turns into a green step that produced nothing.
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug 2>&1 \
            | tee -a /tmp/ci.log

      - name: What is actually in the APK
        # Unbundles the release artifact and checks the staged page survived packaging, because
        # the failure this catches is silent: an empty assets dir yields a valid, signed,
        # installable APK that shows a 404 on a phone and nothing wrong on GitHub.
        #
        # No `| head -N` anywhere near `set -o pipefail`. A truncating pipe kills the writer with
        # SIGPIPE, which is a non-zero exit, which under pipefail fails a step whose whole job
        # was to say "yes, it's all in there" — and it only does it once there are more matching
        # lines than the head allows, so it passes for as long as it is a no-op.
        run: |
          # `x` as well: when a verification step dies, the one thing worth knowing is which line
          # it died on, and `set -e` alone does not say. tee, because the report step reads this
          # file and a step that fails without writing to it arrives undescribed.
          {
            set -euxo pipefail
            apk=android/app/build/outputs/apk/release/app-release.apk
            unzip -l "$apk" | grep -E 'assets/web/(index\.html|app\.js|styles\.css)'
            unzip -l "$apk" | grep -cE 'res/mipmap-[a-z]*[0-9]+/ic_launcher(_round)?\.png'
            unzip -p "$apk" AndroidManifest.xml >/dev/null
            aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
            "$aapt2" dump badging "$apk" > /tmp/badging.txt
            grep -E "package:|uses-permission:|application-label:|sdkVersion:|targetSdkVersion:" /tmp/badging.txt
            # The download must say the number the tag says — read off the APK, not build.gradle,
            # because that is the only copy a user's App Info screen ever reads. Only on a tag
            # run: on a branch push GITHUB_REF_NAME is "main", and asserting the APK says
            # versionName='main' is a check that fires on the branch that is otherwise green.
            case "${GITHUB_REF_NAME}" in
              v[0-9]*) grep -qE "versionName='${GITHUB_REF_NAME#v}'" /tmp/badging.txt ;;
              *) echo "not a tag (${GITHUB_REF_NAME}); skipping the versionName cross-check" ;;
            esac
            echo "release apk contents:"
            unzip -l "$apk" | sed -n '1,40p'
            grep -q "uses-permission:'android.permission.RECORD_AUDIO'" /tmp/badging.txt
            du -h "$apk"
          } 2>&1 | tee -a /tmp/ci.log

      - uses: actions/upload-artifact@v4
        with:
          name: aryans-ai-call-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish a Release with the APK attached
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          body: |
            Sideloadable release build, signed with the repo's checked-in debug key.

            * Install it directly; it needs no Play Store and no account.
            * Update by installing again over the top — the same key is used, so your saved key
              and settings survive. This is the part a runner-generated key would have broken.
            * Android will ask you to allow "install unknown apps" for whichever app opens the
              link. That prompt is the whole cost of not being in the store.
            * Your Gemini API key is typed into the app on first launch and never leaves the
              phone except to `generativelanguage.googleapis.com`.

      - name: Report the failure where it can be read
        # This sandbox cannot download Actions logs at all — the log host is not reachable from
        # it, so `gh run view --log-failed` returns an EOF and a red X tells you nothing about
        # why. Two channels go through hosts that ARE reachable, and both are needed:
        #
        #   an annotation, which needs no token and survives a broken `gh`, is read back from
        #   /check-runs/{id}/annotations — this is the one that has to work;
        #   a commit comment, which is the one a human reading the commit will find, needs
        #   GH_TOKEN mapped by hand. Forgetting that mapping made the step itself fail on the
        #   build that most needed describing, which is the lesson in the annotation check.
        # always() && failure(), and last: `failure()` is evaluated at the step's own
        # position, so a report placed before the steps it reports on is skipped by exactly
        # the failure it exists to describe. That is how an inspection step failing on a
        # SIGPIPE arrived with no annotation and no comment at all.
        if: always() && failure()
        run: |
          {
            grep -E -A5 "FAIL |FAILURE:|^\* What went wrong|error:|Execution failed" /tmp/ci.log
            echo "--- raw tail ---"; tail -25 /tmp/ci.log
          } > /tmp/why.txt 2>/dev/null || true
          one=$(tr '\n' '|' < /tmp/why.txt | tr -d '\r' | head -c 900)
          echo "::error file=android/build,title=android job failed on ${{ github.ref_name }}::${one}"
          printf '### android job failed on %s\n\n```\n%s\n```\n' \
            "${{ github.ref_name }}" "$(head -c 5500 /tmp/why.txt)" > /tmp/body.txt
          gh api -X POST "repos/{owner}/{repo}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/body.txt || echo "commit comment unavailable; the annotation above is the report"
        env:
          # Not automatic. A run step gets no API token unless you map one, and `gh` falls back
          # to "please run gh auth login", which is a confusing end to a step whose whole job is
          # to be less confusing than a red X.
          GH_TOKEN: ${{ github.token }}

